<style>

  header.sticky {

    background: white;

  .progress-bar {

    height: 8px;
    background: var(--slate-200);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--emerald-500), var(--emerald-600));

  }
  .progress-stat {
    font-weight: 700;
    color: var(--emerald-700);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    font-size: 13px;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
    align-items: center;
  }
  .toolbar label {
    font-size: 12px;
    color: var(--slate-600);
    cursor: pointer;
    user-select: none;
  }
  .toolbar input[type="checkbox"] { vertical-align: middle; margin-right: 4px; }
  button {
    background: white;
    border: 1px solid var(--slate-300);
    color: var(--slate-700);
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;

    border-color: var(--emerald-500);
    color: white;
  }

  button.danger {

  }
  button.danger:hover { background: var(--red-100); }
  main { max-width: 920px; margin: 22px auto; padding: 0 22px 80px; }

    border: 1px solid var(--slate-200);
    border-radius: 10px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .phase-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--slate-200);
    background: var(--slate-50);
    cursor: pointer;
    user-select: none;

  .phase-title { font-size: 15px; font-weight: 700; margin: 0; }
  .phase-stat {
    color: var(--slate-500);
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;

  .phase-stat.done { color: var(--emerald-700); }
  .phase-body { padding: 8px 18px 18px; }
  section.phase.collapsed .phase-body { display: none; }
  section.phase.collapsed .phase-header { border-bottom: 0; }

  .group {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px dashed var(--slate-200);
  }
  .group:first-child { margin-top: 8px; padding-top: 0; border-top: 0; }
  .group-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--slate-700);
    margin: 0 0 8px;
    letter-spacing: 0.01em;
  }
  .group-title .ref {
    background: var(--emerald-100);
    color: var(--emerald-700);
    padding: 2px 6px;
    border-radius: 4px;
    margin-right: 6px;
    font-family: ui-monospace, monospace;
    font-size: 11px;

  ul.items { list-style: none; padding: 0; margin: 0; }
  ul.items li {
    display: flex;
    gap: 10px;
    padding: 6px 0;
    align-items: flex-start;
  }
  ul.items input[type="checkbox"] {
    margin-top: 3px;
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    accent-color: var(--emerald-500);
  }
  ul.items label {
    flex: 1;
    cursor: pointer;
    color: var(--slate-700);
  }
  ul.items input:checked + label {
    color: var(--slate-400);
    text-decoration: line-through;
    text-decoration-color: var(--emerald-500);
  }
  .context {
    margin: 4px 0 0 26px;
    padding: 6px 10px;
    background: var(--slate-50);
    border-left: 3px solid var(--slate-300);
    border-radius: 3px;
    font-size: 12px;
    color: var(--slate-600);
  }
  .context code {
    background: var(--slate-200);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 11px;
  }

  body.hide-done ul.items li.done { display: none; }
  body.hide-done .group.all-done { display: none; }

  .badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 700;
    margin-left: 4px;
    vertical-align: middle;
  }
  .badge.neg { background: var(--red-100); color: var(--red-600); }
  .badge.warn { background: var(--amber-100); color: var(--amber-700); }
  .badge.note { background: var(--slate-200); color: var(--slate-600); }

  .priority-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .priority-list li {
    padding: 8px 12px;
    background: var(--emerald-50);
    border-left: 3px solid var(--emerald-500);
    margin-bottom: 6px;
    border-radius: 0 6px 6px 0;
    font-size: 13px;
  }
  .priority-list li code {
    background: white;
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--emerald-700);
    font-weight: 700;
  }

  footer {
    text-align: center;
    color: var(--slate-400);
    font-size: 11px;
    padding: 30px 0 10px;

  @media (max-width: 600px) {
    main { padding: 0 12px 60px; }
    header.sticky { padding: 12px 14px; }
    .phase-header { padding: 12px 14px; }
    .phase-body { padding: 6px 14px 16px; }
  }
  @media print {
    header.sticky { position: static; box-shadow: none; }
    section.phase.collapsed .phase-body { display: block !important; }
    button { display: none; }
    .toolbar { display: none; }
  }
</style>
</head>

</header>

<main id="root"></main>

// Cas critiques (rendu différemment, pas de checkbox — c'est juste un raccourci)
const PRIORITY = [
  { ref: 'L6 + L10', t: 'décrément stock + cristallisation marge + encaissement v2' },
  { ref: 'L13', t: 'dette cumulative qui se reporte' },
  { ref: 'L18', t: 'transfert qui maintient le <code>stock_courant_livreur</code> (fix précédent)' },
  { ref: 'L16', t: 'achat refusé après blocage' },
  { ref: 'L20', t: 'prévision multi-produits' },
  { ref: 'L17', t: 'reversement avec dette qui absorbe la marge' },
];

// ============================================================================
// État (localStorage)
// ============================================================================
const STORAGE_KEY = 'test-plan-d-state';
let state = {};
try { state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { state = {}; }

const collapsedKey = 'test-plan-d-collapsed';
let collapsed = {};
try { collapsed = JSON.parse(localStorage.getItem(collapsedKey) || '{}'); } catch { collapsed = {}; }

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function saveCollapsed() {
  localStorage.setItem(collapsedKey, JSON.stringify(collapsed));
}

// ============================================================================
// Rendu
// ============================================================================
const root = document.getElementById('root');

function makeId(phaseId, groupRef, idx) {
  return `${phaseId}-${groupRef}-${idx}`;
}

function render() {
  root.innerHTML = '';
  for (const phase of PHASES) {
    const sec = document.createElement('section');
    sec.className = 'phase';
    if (collapsed[phase.id]) sec.classList.add('collapsed');
    sec.dataset.phase = phase.id;

    const head = document.createElement('div');
    head.className = 'phase-header';
    head.onclick = () => toggleCollapse(phase.id);

    const title = document.createElement('h2');
    title.className = 'phase-title';
    title.innerHTML = `${phase.emoji} ${phase.title}`;
    head.appendChild(title);

    const stat = document.createElement('span');
    stat.className = 'phase-stat';
    stat.dataset.phaseStat = phase.id;
    head.appendChild(stat);

    sec.appendChild(head);

    const body = document.createElement('div');
    body.className = 'phase-body';

    for (const group of phase.groups) {
      const g = document.createElement('div');
      g.className = 'group';
      g.dataset.group = `${phase.id}-${group.ref}`;

      const gt = document.createElement('h3');
      gt.className = 'group-title';
      let badge = '';
      if (group.badge === 'neg') badge = ' <span class="badge neg">négatif</span>';
      gt.innerHTML = `<span class="ref">${group.ref}</span>${group.title}${badge}`;
      g.appendChild(gt);

      const ul = document.createElement('ul');
      ul.className = 'items';
      group.items.forEach((item, idx) => {
        const id = makeId(phase.id, group.ref, idx);
        const li = document.createElement('li');
        li.dataset.id = id;

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.id = id;
        cb.checked = !!state[id];
        cb.onchange = () => onToggle(id, cb.checked);

        const lbl = document.createElement('label');
        lbl.htmlFor = id;
        lbl.innerHTML = item.t;

        li.appendChild(cb);
        li.appendChild(lbl);
        if (item.ctx) {
          const ctx = document.createElement('div');
          ctx.className = 'context';
          ctx.innerHTML = item.ctx;
          li.appendChild(ctx);
        }
        if (state[id]) li.classList.add('done');
        ul.appendChild(li);
      });
      g.appendChild(ul);
      body.appendChild(g);
    }
    sec.appendChild(body);

    // Cas critiques après la dernière phase
    if (phase.id === 'final') {
      const priority = document.createElement('section');
      priority.className = 'phase';
      const head2 = document.createElement('div');
      head2.className = 'phase-header';
      head2.style.cursor = 'default';
      const t2 = document.createElement('h2');
      t2.className = 'phase-title';
      t2.innerHTML = '🎯 Cas critiques à tester en priorité';
      head2.appendChild(t2);
      const sub = document.createElement('span');
      sub.className = 'phase-stat';
      sub.textContent = 'raccourcis (non-cochables)';
      head2.appendChild(sub);
      priority.appendChild(head2);
      const body2 = document.createElement('div');
      body2.className = 'phase-body';
      const p = document.createElement('p');
      p.style.cssText = 'margin: 0 0 12px; color: var(--slate-600); font-size: 13px;';
      p.textContent = 'Si tu veux tester rapidement les points sensibles sans dérouler tout :';
      body2.appendChild(p);
      const ul2 = document.createElement('ul');
      ul2.className = 'priority-list';
      for (const prio of PRIORITY) {
        const li2 = document.createElement('li');
        li2.innerHTML = `<code>${prio.ref}</code> — ${prio.t}`;
        ul2.appendChild(li2);
      }
      body2.appendChild(ul2);
      priority.appendChild(body2);
      root.appendChild(sec);
      root.appendChild(priority);
    } else {
      root.appendChild(sec);
    }
  }
  updateAllStats();
}

function onToggle(id, checked) {
  if (checked) state[id] = 1; else delete state[id];
  saveState();
  const li = document.querySelector(`li[data-id="${id}"]`);
  if (li) li.classList.toggle('done', checked);
  updateAllStats();
}

function toggleCollapse(phaseId) {
  collapsed[phaseId] = !collapsed[phaseId];
  saveCollapsed();
  document.querySelector(`section[data-phase="${phaseId}"]`).classList.toggle('collapsed');
}

function updateAllStats() {
  let totalAll = 0, doneAll = 0;
  for (const phase of PHASES) {
    let totalP = 0, doneP = 0;
    for (const group of phase.groups) {
      let totalG = 0, doneG = 0;
      group.items.forEach((item, idx) => {
        const id = makeId(phase.id, group.ref, idx);
        totalG++;
        totalP++;
        totalAll++;
        if (state[id]) { doneG++; doneP++; doneAll++; }
      });
      const groupEl = document.querySelector(`div.group[data-group="${phase.id}-${group.ref}"]`);
      if (groupEl) groupEl.classList.toggle('all-done', totalG > 0 && doneG === totalG);
    }
    const stat = document.querySelector(`[data-phase-stat="${phase.id}"]`);
    if (stat) {
      stat.textContent = `${doneP} / ${totalP}`;
      stat.classList.toggle('done', totalP > 0 && doneP === totalP);
    }
  }
  document.getElementById('overall-stat').textContent = `${doneAll} / ${totalAll}`;
  const pct = totalAll === 0 ? 0 : (doneAll / totalAll) * 100;
  document.getElementById('overall-fill').style.width = pct + '%';
}

function expandAll() {
  for (const phase of PHASES) collapsed[phase.id] = false;
  saveCollapsed();
  document.querySelectorAll('section.phase').forEach((s) => s.classList.remove('collapsed'));
}

function collapseAll() {
  for (const phase of PHASES) collapsed[phase.id] = true;
  saveCollapsed();
  document.querySelectorAll('section.phase').forEach((s) => s.classList.add('collapsed'));
}

function resetAll() {
  if (!confirm('Réinitialiser toutes les coches ? Cette action est irréversible.')) return;
  state = {};
  saveState();
  document.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
    if (cb.id) cb.checked = false;
  });
  document.querySelectorAll('li.done').forEach((li) => li.classList.remove('done'));
  updateAllStats();
}

document.getElementById('hide-done').addEventListener('change', (e) => {
  document.body.classList.toggle('hide-done', e.target.checked);
  localStorage.setItem('test-plan-d-hide-done', e.target.checked ? '1' : '0');
});
if (localStorage.getItem('test-plan-d-hide-done') === '1') {
  document.getElementById('hide-done').checked = true;
  document.body.classList.add('hide-done');
}

render();
</script>
